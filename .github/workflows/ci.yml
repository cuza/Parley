# Lints, builds and runs the unit tests on every push and pull request. UI tests need a signed-in desktop session and
# stay local; the regression baseline tests skip themselves without PARLEY_BASELINE. So do the suites that draw,
# animate or live-resize windows: the runner's virtual display does none of those as a real screen does.
name: CI

# Changes that can't affect the build or the tests don't start a run.
on:
  push:
    branches: ['**']   # a release's tag points at a commit its branch push already tested
    paths-ignore: &no-code
      - '**.md'
      - 'Screenshots/**'
      - 'LICENSE'
      - '.gitignore'
      - '.githooks/**'
  pull_request:
    paths-ignore: *no-code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27   # GitHub's Xcode 27 image, a public preview, Apple silicon only
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - uses: actions/checkout@v4

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      # The pre-commit hook formats each commit's files; this catches a commit made without it.
      - name: Format
        run: |
          xcrun swift-format format -i --parallel $(git ls-files '*.swift' | grep -v '/Proto/')
          git diff --exit-code --stat || { echo "::error::Files above aren't formatted: run xcrun swift-format format -i on them."; exit 1; }

      # Warnings are listed; only errors fail, as in the pre-commit hook.
      - name: Lint
        run: swiftlint lint --quiet --reporter github-actions-logging

      - name: Generate the project
        run: xcodegen generate

      - uses: actions/cache@v4
        with:
          path: build/spm
          key: spm-${{ hashFiles('Parley.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ParleyKit/Package.swift') }}

      # No signing identity on the runner: the linker's ad-hoc signature is enough to host the tests.
      - name: Unit tests
        run: |
          xcodebuild test \
            -project Parley.xcodeproj \
            -scheme Parley \
            -destination 'platform=macOS' \
            -only-testing:ParleyTests \
            -skip-testing:ParleyTests/AnimatedEmojiTests \
            -skip-testing:ParleyTests/BlockDrawingTests \
            -skip-testing:ParleyTests/MessageTableResizeTests \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO
