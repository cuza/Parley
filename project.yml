name: Parley
options:
  xcodeVersion: "27.1"   # marks the generated project as current, so Xcode stops offering setting upgrades
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ECKB9WN282
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # The app's and the share extension's version, each alone on its line.
    MARKETING_VERSION: "1.7.20"
    CURRENT_PROJECT_VERSION: "81"
    PARLEY_URL_SCHEME: parley   # the share extension's hand-off link
    PARLEY_DISPLAY_NAME: Parley   # the app's and the share extension's name
  configs:
    Debug:
      PARLEY_URL_SCHEME: parley-debug   # so a Debug build's share sheet never reaches the installed copy
      PARLEY_DISPLAY_NAME: Parley Debug
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.38.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Parley:
    type: application
    platform: macOS
    sources:
      - path: Parley
        type: syncedFolder
    dependencies:
      - package: SwiftProtobuf
      - package: Sparkle
      - target: ParleyShare
        embed: true
    info:
      path: Parley/Info.plist
      properties:
        NSUserActivityTypes: [INSendMessageIntent]   # communication notifications
        NSMicrophoneUsageDescription: Parley records voice messages with the microphone when you choose to.
        # "Parley Debug" in Debug builds: Siri, Spotlight, the Share menu and System Settings tell it from the installed copy.
        CFBundleName: $(PARLEY_DISPLAY_NAME)
        CFBundleDisplayName: $(PARLEY_DISPLAY_NAME)
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleURLTypes:   # parley://share, the share extension's hand-off
          - CFBundleURLName: dev.cuza.Parley.share
            CFBundleURLSchemes: [$(PARLEY_URL_SCHEME)]
        NSServices:   # Services ▸ Send to Parley: text or files go into a conversation's draft
          - NSMessage: sendToParley
            NSMenuItem: { default: Send to Parley }
            NSSendTypes: [public.utf8-plain-text, public.file-url]
            NSRequiredContext: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/cuza/Parley/releases/latest/download/appcast.xml   # Sparkle updates
        SUPublicEDKey: VxKIqSk8XgX3+P7VBItQ2xHV3CX1AVsMeWpBRNMDVsc=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuza.Parley
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Parley/Parley.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug runs as its own app: its own Spotlight index, Shortcuts, notifications and extensions, away from installs.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.cuza.Parley.debug
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug   # the icon with a DEBUG label, so Spotlight and the Dock tell them apart
  ParleyShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ParleyShare
        type: syncedFolder
    info:
      path: ParleyShare/Info.plist
      properties:
        CFBundleName: $(PARLEY_DISPLAY_NAME)
        CFBundleDisplayName: $(PARLEY_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ParleyURLScheme: $(PARLEY_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuza.Parley.Share
        CODE_SIGN_ENTITLEMENTS: ParleyShare/ParleyShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.cuza.Parley.debug.Share
  ParleyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ParleyTests
        type: syncedFolder
    dependencies:
      - target: Parley
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ParleyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ParleyUITests
        type: syncedFolder
    dependencies:
      - target: Parley
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Parley
schemes:
  Parley:
    build:
      targets:
        Parley: all
        ParleyTests: [test]
        ParleyUITests: [test]
    test:
      targets: [ParleyTests, ParleyUITests]
