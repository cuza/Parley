# SwiftLint's default rules: standard Swift style. Warnings are allowed; errors stop a commit (.githooks/pre-commit).
# swift-format (.swift-format) formats the code first.
included:
  - Parley
  - ParleyShare
  - ParleyTests
  - ParleyUITests
  - ParleyKit
excluded:
  - ParleyKit/Sources/ParleyData/Dynamite/Proto   # generated by protoc
disabled_rules:
  - optional_data_string_conversion   # String(decoding:as:) is the standard library's lossy decode, used on purpose
  # swift-format (.swift-format) owns layout, and these rules disagree with it:
  - closure_parameter_position   # it moves a closure's parameters to the next line when the line is full
  - opening_brace                # it puts a brace on its own line when the brace doesn't fit
  - trailing_comma               # it adds one after the last element of multi-element lists only
identifier_name:
  min_length: 2       # short words Apple's APIs use too: at, on, to, by, me, dm
  excluded: [x, y]   # coordinates, as Swift's own geometry types name them
type_name:
  excluded: [ID]   # the typed identifier, ID<Tag>
